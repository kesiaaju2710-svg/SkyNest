<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | SkyNest Co-Living Spaces</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <a href="index.html">SkyNest</a>
    <nav>
      <a href="index.html">Home</a>
      <a href="accommodation.html">Accommodation</a>
      <a href="facilities.html">Facilities</a>
      <a href="advice.html">Help and Advice</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
   <h1>Contact us</h1>
<p>Ask about availability, prices, custom packages or accessibility support.</p>

<form id="enquiry">
  <label for="name">Name</label>
  <input id="name" name="name" type="text" required>

  <label for="email">Email</label>
  <input id="email" name="email" type="email" required>

  <label for="package">Package</label>
  <select id="package" name="package">
    <option>Premium Stay</option>
    <option>Standard Stay</option>
    <option>Short-Term Stay</option>
    <option>Custom package</option>
  </select>

  <label for="message">Message (include any accessibility needs)</label>
  <textarea id="message" name="message" rows="5" required></textarea>

  <button class="button" type="submit">Send enquiry</button>
</form>
    <p id="thanks" style="display:none; background:#dff3e4; padding:16px; border-radius:8px;" role="status">
  Thank you. We have received your enquiry and will reply soon.
</p>
  </main>
  <footer>
    <p>SkyNest Co-Living Spaces, Singapore</p>
  </footer>
  <script>
  document.getElementById('enquiry').addEventListener('submit', function (e) {
    e.preventDefault();
    document.getElementById('enquiry').style.display = 'none';
    document.getElementById('thanks').style.display = 'block';
  });
</script>
</body>
</html>
