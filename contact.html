  <main>
   <h1>Contact us</h1>
<p>Ask about availability, prices, custom packages or accessibility support.</p>

<form action="mailto:info@skynest.example" method="post" enctype="text/plain">
  <label for="name">Name</label>
  <input id="name" name="name" type="text" required>

  <label for="email">Email</label>
  <input id="email" name="email" type="email" required>

  <label for="package">Package</label>
  <select id="package" name="package">
    <option>Premium Stay</option>
    <option>Standard Stay</option>
    <option>Short-Term Stay</option>
    <option>Custom package</option>
  </select>

  <label for="message">Message (include any accessibility needs)</label>
  <textarea id="message" name="message" rows="5" required></textarea>

  <button class="button" type="submit">Send enquiry</button>
</form>
  </main>

  <footer>
    <p>SkyNest Co-Living Spaces, Singapore</p>
  </footer>
</body>
